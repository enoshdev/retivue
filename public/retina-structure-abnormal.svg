    </g>

    <!-- Lesion Callout 1: Microaneurysm Cluster -->
    <g transform="translate(470, 345)">
      <rect x="-35" y="-25" width="75" height="50" rx="6" stroke="#ef4444" stroke-width="1.75" fill="rgba(239, 68, 68, 0.15)" />
