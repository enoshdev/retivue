    <g transform="translate(40, 40)">
      <rect x="0" y="0" width="240" height="26" rx="6" fill="#18181b" stroke="#eab308" stroke-width="1" />
      <text x="12" y="17" fill="#facc15" font-family="monospace" font-size="10" font-weight="bold">SIMULATED DEMO ANALYSIS</text>
