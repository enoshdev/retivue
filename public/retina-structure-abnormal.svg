    <!-- Lesion Callout 3: Blot Hemorrhages -->
    <g transform="translate(430, 420)">
      <rect x="-18" y="-14" width="36" height="28" rx="4" stroke="#dc2626" stroke-width="1.75" fill="rgba(220, 38, 38, 0.2)" />
      <rect x="-65" y="18" width="95" height="18" rx="3" fill="#450a0a" stroke="#dc2626" stroke-width="1" />
