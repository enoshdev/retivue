    <!-- Lesion Callout 2: Hard Lipid Exudate Circinate -->
    <g transform="translate(530, 395)">
      <circle cx="0" cy="0" r="36" stroke="#eab308" stroke-width="1.75" stroke-dasharray="4 3" fill="rgba(234, 179, 8, 0.15)" />
      <rect x="25" y="-10" width="95" height="20" rx="4" fill="#422006" stroke="#eab308" stroke-width="1" />
      <text x="72" y="4" fill="#fef08a" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">HARD EXUDATE</text>
