      <circle cx="465" cy="335" r="3" fill="#ff2222" />
      <circle cx="510" cy="340" r="3" fill="#ff2222" />
      <circle cx="530" cy="380" r="3" fill="#ff2222" />
      <circle cx="545" cy="430" r="3" fill="#ff2222" />
      <circle cx="480" cy="470" r="3" fill="#ff2222" />
      <circle cx="440" cy="460" r="3" fill="#ff2222" />
      <circle cx="420" cy="380" r="3" fill="#ff2222" />
      <circle cx="515" cy="460" r="3" fill="#ff2222" />
      <circle cx="475" cy="490" r="3" fill="#ff2222" />
      <circle cx="560" cy="410" r="3" fill="#ff2222" />
      <circle cx="430" cy="340" r="3" fill="#ff2222" />
      <circle cx="500" cy="320" r="3" fill="#ff2222" />
      <circle cx="390" cy="430" r="3" fill="#ff2222" />
      <circle cx="510" cy="495" r="3" fill="#ff2222" />
      <circle cx="518" cy="395" r="4" fill="#ffeb3b" />
      <circle cx="525" cy="392" r="3.5" fill="#ffeb3b" />
      <circle cx="476" cy="435" r="4" fill="#ffeb3b" />
